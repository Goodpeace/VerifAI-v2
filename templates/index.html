<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VerifAI-v2 — Is this link safe?</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main>
  <header>
    <h1>VerifAI-v2</h1>
    <p class="sub">Got a suspicious link? Paste it below. We examine the address
    <strong>without ever opening it</strong>, then tell you in plain words whether it's safe.</p>
  </header>

  <form id="f">
    <input id="url" placeholder="Paste a link, e.g. https://example.com/login" autocomplete="off" required>
    <button type="submit">Check link</button>
  </form>
  <p class="nav"><a href="/history">Past checks</a></p>

  <div id="out" hidden></div>
</main>
<script src="/static/js/main.js"></script>
</body>
</html>
